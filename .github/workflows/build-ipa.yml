# Build the LinuxRunner IPA from source on a macos runner.
#
# LinuxRunner has no public CI workflow in upstream, so this job reproduces the
# documented offline build (docs/BUILDING.md):
#   1. install meson + lld           (bootstrap-macos.sh only checks, not installs)
#   2. select the Xcode version the build was authored against
#   3. scripts/bootstrap-macos.sh    (toolchain + pinned submodule deps)
#   4. scripts/build-ipa.sh --unsigned (xcodebuild archive -> ad-hoc signed IPA)
#   5. scripts/verify-ipa.py         (structural + fingerprint validation)
#
# Manual + push/PR triggers on zh-Hans.

name: Build IPA (zh-Hans)

on:
  workflow_dispatch:
  push:
    branches: [ zh-Hans ]
  pull_request:
    branches: [ zh-Hans ]

jobs:
  build-ipa:
    name: Build unsigned IPA on macOS
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Check out source (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version || true
          git --version
          cmake --version || true

      - name: Install missing toolchain (meson + ld.lld)
        run: |
          brew install meson lld
          # ld.lld binary layout: homebrew may place it as ld.lld-XX; ensure on PATH
          if ! command -v ld.lld >/dev/null 2>&1; then
            LATEST_LD=$(ls -1 /opt/homebrew/opt/llvm/bin/ld.lld* 2>/dev/null | sort | tail -1)
            [ -n "$LATEST_LD" ] && ln -s "$LATEST_LD" /usr/local/bin/ld.lld || true
          fi
          command -v meson && meson --version
          command -v ld.lld && ld.lld --version || echo "ld.lld not on PATH yet"

      - name: Pin Xcode 16.4 (default on macos-15)
        run: |
          # Xcode 16.4 is what the runner already has; Xcode 27 is not
          # publicly available on GitHub-hosted macos runners yet, so build
          # against 16.4 which is the documented "minimum" (iOS 15.0 target).
          xcodebuild -version

      - name: Bootstrap toolchain and pinned dependencies
        run: scripts/bootstrap-macos.sh

      - name: Build ad-hoc signed IPA (unsigned mode)
        run: scripts/build-ipa.sh --unsigned

      - name: Verify IPA structure and source fingerprint
        run: python3 scripts/verify-ipa.py build/releases

      - name: Print artifact location and checksum
        run: |
          ls -lh build/releases
          shasum -a 256 build/releases/*.ipa || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LinuxRunner-zh-Hans-ipa
          path: build/releases/*.ipa
          if-no-files-found: error

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LinuxRunner-zh-Hans-reports
          path: |
            build/releases/*.log
            build/releases/*.report
          if-no-files-found: ignore
