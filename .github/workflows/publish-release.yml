# Create a GitHub Release with the prebuilt zh-Hans IPA as an asset.
#
# The personal token (xngfhghfgd) cannot upload release assets via
# uploads.github.com (returns "Bad Size" on every attempt), so this workflow
# uses the repo's own GITHUB_TOKEN — which has full write access to
# release assets — to create the release and attach the IPA committed under
# dist/ in the zh-Hans branch.
#
# Trigger: manual workflow_dispatch only (a push trigger would loop, since
# this workflow's own success updates the release and would re-trigger on
# subsequent pushes to dist/).

name: Create Release with IPA

on:
  workflow_dispatch:

jobs:
  publish-release:
    name: Publish release with IPA asset
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: zh-Hans

      - name: Verify IPA exists
        run: |
          ls -lh dist/LinuxRunner-zh-Hans.ipa
          shasum -a 256 dist/LinuxRunner-zh-Hans.ipa

      - name: Create / update release and upload IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="v1.0.1-zh-Hans"
          REPO="${{ github.repository }}"

          # 1. Delete any existing release on this tag
          REL_ID=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/releases?per_page=100" \
            | python3 -c "
              import json,sys
              for r in json.load(sys.stdin):
                  if r.get('tag_name')=='$TAG':
                      print(r['id']); break
            ")
          if [ -n "$REL_ID" ]; then
            echo "deleting old release $REL_ID"
            curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/releases/$REL_ID" > /dev/null
            sleep 3
          fi

          # 2. Delete the tag itself (a leftover tag blocks release creation)
          curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/git/refs/tags/$TAG" > /dev/null 2>&1 || true

          # 3. Create the release
          REL=$(curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"tag_name\": \"$TAG\",
              \"name\": \"LinuxRunner 1.0.1 (zh-Hans) - 简体中文版\",
              \"target_commitish\": \"zh-Hans\",
              \"prerelease\": true,
              \"draft\": false,
              \"body\": \"简体中文翻译版 LinuxRunner 1.0.1 (zh-Hans)。ad-hoc 签名,需配合 Sideloadly / AltStore 侧载安装。源码与翻译: 分支 zh-Hans。\"
            }" \
            "https://api.github.com/repos/$REPO/releases")
          NEW_ID=$(echo "$REL" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('id') or d.get('message'))")
          echo "created release $NEW_ID"
          [ "$NEW_ID" = "None" ] && exit 1

          # 4. Upload the IPA as a standard release asset
          UPLOAD_URL=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/releases/$NEW_ID" \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['upload_url'].split('?')[0])")
          echo "upload_url=$UPLOAD_URL"
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -F "file=@dist/LinuxRunner-zh-Hans.ipa" \
            "${UPLOAD_URL}/LinuxRunner-zh-Hans.ipa?name=LinuxRunner-zh-Hans.ipa" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print('asset:',d.get('name'),d.get('size'),'bytes');print('download:',d.get('browser_download_url'))"
